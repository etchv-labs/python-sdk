name: Release
# Runs when the monorepo export tags this repository v<version>. Registries trust
# this workflow through OIDC (trusted publishing): no publish token is stored.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          check-latest: true
      - name: Tag matches the package version
        run: test "v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" = "$GITHUB_REF_NAME"
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: pip install uv==0.13.1
      - run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
