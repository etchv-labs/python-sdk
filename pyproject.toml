[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "etchv-sdk"
version = "1.1.0"
description = "Official Python client for the Etchv forensic watermarking API for images, PDFs and videos"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Etchv Labs", email = "hello@etchv.com"}]
keywords = ["etchv", "watermark", "watermarking", "forensic watermarking", "invisible watermark", "image", "pdf", "video", "detection", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://etchv.com/docs"
Documentation = "https://etchv.com/docs/sdks/python"
Repository = "https://github.com/etchv-labs/python-sdk"
Issues = "https://github.com/etchv-labs/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/etchv"]

[tool.hatch.build.targets.sdist]
include = ["src/etchv", "tests", "README.md", "LICENSE", "pyproject.toml"]
