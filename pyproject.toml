[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "etchv-sdk"
version = "0.3.0"
description = "Python client for Etchv image watermarking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Etchv", email = "hello@etchv.com"}]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://etchv.com"
Repository = "https://github.com/etchv-labs/python-sdk"
Issues = "https://github.com/etchv-labs/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/etchv"]
